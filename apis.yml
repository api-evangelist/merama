name: merama
description: Merama is a Latin American e-commerce company that invests in and scales established online
  brands selling on marketplaces such as Amazon and MercadoLibre. It acquires a substantial stake while
  founders retain operational control, then provides working capital, business intelligence, digital
  marketing, cross-border expansion across Latin America and the US, and proprietary operating technology
  to accelerate growth. Merama operates as a brand aggregator / roll-up rather than a developer platform
  and publishes no public API, developer portal, or SDK surface.
